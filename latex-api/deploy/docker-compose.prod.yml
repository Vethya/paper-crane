services:
  latex-api:
    build:
      context: ../..
      dockerfile: latex-api/Dockerfile
    image: resume-manager-latex-api:prod
    restart: unless-stopped
    environment:
      PORT: "3027"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN}"
    expose:
      - "3027"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${LATEX_API_MEMORY_LIMIT:-1536m}"
    cpus: "${LATEX_API_CPUS:-1.5}"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - latex-api
    environment:
      DOMAIN: "${DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
